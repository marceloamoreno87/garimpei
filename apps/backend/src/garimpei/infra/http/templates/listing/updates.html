{% if changed or expired %}<div class="notice"><strong>{% if expired %}A revisão exibida expirou{% else %}Há atualizações{% endif %}</strong><p>Seus resultados continuam como estavam até você atualizar.</p><a class="button primary"
                                                                                                                                                                                                                 data-apply
                                                                                                                                                                                                                 href="{{ refresh }}&amp;aplicar=1"
                                                                                                                                                                                                                 hx-get="{{ refresh }}&amp;aplicar=1"
                                                                                                                                                                                                                 hx-target="#exploration"
                                                                                                                                                                                                                 hx-swap="outerHTML"
                                                                                                                                                                                                                 hx-sync="#exploration:replace">Atualizar lista</a></div>{% endif %}
