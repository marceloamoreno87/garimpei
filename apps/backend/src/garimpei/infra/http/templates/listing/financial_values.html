<dl class="financial-values" aria-label="Valores da oferta">
    <div class="financial-purchase">
        <dt>Preço de compra</dt>
        <dd>
            {{ price }}
        </dd>
    </div>
    <div class="financial-resale">
        <dt>Preço de venda estimado</dt>
        <dd>
            {{ resale }}
        </dd>
    </div>
    <div class="financial-profit{% if profit_negative %} financial-profit--negative{% elif profit_unavailable %} financial-profit--unavailable{% endif %}">
        <dt>Lucro estimado</dt>
        <dd>
            {{ profit }}
        </dd>
    </div>
</dl>
