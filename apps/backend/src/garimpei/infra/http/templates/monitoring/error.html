{% extends "monitoring/layout.html" %}
{% block main %}
    <main id="main" tabindex="-1">
        <h1>Não foi possível carregar</h1>
        <div class="error-summary" id="form-error" role="alert" tabindex="-1">
            <p>{% if error %}{{ error }}{% else %}Ocorreu um erro inesperado. Tente novamente.{% endif %}</p>
            <p>{% if error %}{{ error.code }}{% else %}INTERNAL_ERROR{% endif %}</p>
        </div>
        <a href="/">Tentar novamente</a>
    </main>
{% endblock %}
