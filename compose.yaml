x-app: &app
  image: garimpei-app:${GARIMPEI_IMAGE_REVISION:-${GARIMPEI_ENVIRONMENT_ID}}
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    target: runtime
  init: true
  user: "${GARIMPEI_UID:-1000}:${GARIMPEI_GID:-1000}"
  env_file: ["${GARIMPEI_ENV_FILE:?private environment file required}"]
  environment: &app-env
    GARIMPEI_CONTAINERIZED: "true"
    GARIMPEI_ENV: ${GARIMPEI_ENV:-dev}
    GARIMPEI_INSTANCE: ${GARIMPEI_INSTANCE:?instance required}
    GARIMPEI_RUN_ID: ${GARIMPEI_RUN_ID:?run required}
    GARIMPEI_DISPOSABLE: ${GARIMPEI_DISPOSABLE:-false}
    GARIMPEI_RUNTIME_ROOT: /state
    GARIMPEI_WEB_PORT: ${GARIMPEI_WEB_PORT}
    GARIMPEI_PG_PORT: ${GARIMPEI_PG_PORT}
    GARIMPEI_WAHA_PORT: ${GARIMPEI_WAHA_PORT}
    GARIMPEI_AI_PORT: ${GARIMPEI_AI_PORT:-11434}
    GARIMPEI_INTEGRATION_PRIVATE_DIR: /private/integrations
    GARIMPEI_MEDIA_ROOT: /private/media
    GARIMPEI_BACKUP_DIR: /private/backups
    GARIMPEI_GPU_LOCK: /gpu/gpu-owner.json
    GARIMPEI_GPU_OWNER: ${GARIMPEI_CHECKOUT}:${GARIMPEI_ENVIRONMENT_ID}
  labels: &labels
    com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
    com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
  volumes: &app-volumes
    - ${GARIMPEI_STATE_DIR:?state required}/${GARIMPEI_ENVIRONMENT_ID}:/state/${GARIMPEI_ENVIRONMENT_ID}
    - ${GARIMPEI_PRIVATE_DIR:?private directory required}:/private
    - ${GARIMPEI_GPU_DIR:?GPU coordination required}:/gpu
    - ${GARIMPEI_PRIVATE_DIR}/facebook-profile:/facebook-profile
  shm_size: 1gb
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true, "seccomp:./scripts/chromium-seccomp.json"]
  depends_on:
    postgres:
      condition: service_healthy
  networks: [data, outbound]
services:
  web:
    <<: *app
    command: [web]
    ports: ["127.0.0.1:${GARIMPEI_WEB_PORT}:8000"]
    healthcheck:
      test: [CMD, python, -m, garimpei.infra.runtime.container_entrypoint, ready]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ${GARIMPEI_STATE_DIR}/${GARIMPEI_ENVIRONMENT_ID}:/state/${GARIMPEI_ENVIRONMENT_ID}
      - ${GARIMPEI_PRIVATE_DIR}/media:/private/media:ro
      - ${GARIMPEI_PRIVATE_DIR}/integrations:/private/integrations
      - ${GARIMPEI_PRIVATE_DIR}/backups:/private/backups
    networks: [data, outbound]
  worker:
    <<: *app
    cap_add: [SYS_CHROOT]
    command: [worker]
    networks: [data, outbound, inference]
  manage:
    <<: *app
    cap_add: [SYS_CHROOT]
    profiles: [tools]
    command: [manage, check]
    networks: [data, outbound, inference]
  quality:
    profiles: [tools]
    image: garimpei-quality:${GARIMPEI_IMAGE_REVISION:-${GARIMPEI_ENVIRONMENT_ID}}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: quality
    init: true
    user: "${GARIMPEI_UID:-1000}:${GARIMPEI_GID:-1000}"
    group_add: ["${GARIMPEI_DOCKER_GID:-0}"]
    network_mode: host
    labels: *labels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: []
    command: [node, /app/scripts/run-gates.mjs]
    environment:
      DJANGO_SETTINGS_MODULE: garimpei.config.test_settings
      TMPDIR: /tmp/g23tmp
  postgres:
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U garimpei -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: garimpei
      POSTGRES_DB: ${GARIMPEI_DB_NAME:?owned database required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private password required}
    ports:
      - "127.0.0.1:${GARIMPEI_PG_PORT:?port required}:5432"
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  waha:
    networks: [outbound]
    image: devlikeapro/waha:gows-2026.10.1@sha256:1f7faeb0227ad5edb5711f7058bfce807ea65e5f92234af0778e4db140f6eb46
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?private API key required}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "False"
      WHATSAPP_SWAGGER_ENABLED: "False"
      WAHA_PRINT_QR: "False"
    ports:
      - "127.0.0.1:${GARIMPEI_WAHA_PORT:?port required}:3000"
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
    volumes:
      - waha_sessions:/app/.sessions
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "5m"
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
    volumes:
      - ollama_models:/root/.ollama
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  ollama_models:
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
  postgres_data:
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
  waha_sessions:
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
networks:
  data:
    internal: true
    labels: *labels
  outbound:
    labels: *labels
  inference:
    internal: true
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
  default:
    labels:
      com.garimpei.environment: ${GARIMPEI_ENVIRONMENT_ID}
      com.garimpei.checkout: ${GARIMPEI_CHECKOUT}
